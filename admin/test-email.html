<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email - KHR Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        
        .info-box h3 {
            color: #1976D2;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .info-box p {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Test Email Configuration</h1>
        <p class="subtitle">Verify SMTP settings are working correctly</p>
        
        <div class="info-box">
            <h3>Current SMTP Configuration:</h3>
            <p>
                <strong>Server:</strong> smtp.gmail.com<br>
                <strong>Port:</strong> 587 (TLS)<br>
                <strong>From:</strong> ranjith888999@gmail.com
            </p>
        </div>
        
        <form id="testEmailForm">
            <div class="form-group">
                <label for="email">Recipient Email Address:</label>
                <input type="email" id="email" name="email" required 
                       placeholder="Enter email address to test" 
                       value="ranjith888999@gmail.com">
            </div>
            
            <button type="submit" class="btn" id="sendBtn">
                Send Test Email
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>
    
    <script>
        document.getElementById('testEmailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const sendBtn = document.getElementById('sendBtn');
            const messageDiv = document.getElementById('message');
            
            // Disable button and show loading state
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/test-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });
                
                const result = await response.json();
                
                messageDiv.style.display = 'block';
                
                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = `
                        <strong>✓ Success!</strong><br>
                        ${result.message}<br>
                        <small>Check the inbox/spam folder of ${email}</small>
                    `;
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.innerHTML = `
                        <strong>✗ Error!</strong><br>
                        ${result.message}<br>
                        ${result.details ? '<small>' + result.details.substring(0, 200) + '...</small>' : ''}
                    `;
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `
                    <strong>✗ Network Error!</strong><br>
                    ${error.message}
                `;
            } finally {
                // Re-enable button
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Test Email';
            }
        });
    </script>
</body>
</html>
